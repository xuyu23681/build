# .github/workflows/build.yml
name: Armbian RK322x TVBox Build (Compatible with rk322x-box.tvb)

on:
  push:
    branches: [ main ]
    paths:
      - 'userpatches/**'     # 只在改 DTS/overlay 时自动触发
      - 'config/boards/**'   # 板配置变更
      - '.github/workflows/**'
  workflow_dispatch:        # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest  # Ubuntu 24.04 (Noble) - 官方支持的 host OS (2025)
    steps:
      - name: Checkout your repo (with custom DTS overlay)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Armbian Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential debootstrap qemu-user-static binfmt-support python3-pip ccache flex bison libssl-dev device-tree-compiler bc kmod cpio unzip rsync

      - name: Clone Official Armbian Build Framework
        run: |
          # 克隆官方 armbian/build（包含 rk322x-box.tvb）
          git clone --depth=1 https://github.com/armbian/build
          cd build
          
          # 复制你的自定义文件（DTS overlay 等）
          cp -r ../userpatches ./userpatches || true
          cp -r ../config ./config || true  # 如果有额外板配置
          
          # 调试：输出参数确认 + host OS + BOARD 检查
          echo "Host OS: $(lsb_release -ds)"
          echo "Available boards: $(ls config/boards/ | grep rk322x || echo 'rk322x-box.tvb loaded')"
          echo "Running compile.sh with params: BOARD=rk322x-box BRANCH=current RELEASE=bookworm BUILD_MINIMAL=no BUILD_DESKTOP=no KERNEL_ONLY=no KERNEL_CONFIGURE=no OVERLAYS=rk322x-custom-overlay COMPRESS_OUTPUTIMAGE=sha,img,xz EXPERT=yes USE_CCACHE=yes"
          
          # 单行命令：用官方 rk322x-box BOARD（.tvb 配置），加载你的 overlay
          ./compile.sh BOARD=rk322x-box BRANCH=current RELEASE=bookworm BUILD_MINIMAL=no BUILD_DESKTOP=no KERNEL_ONLY=no KERNEL_CONFIGURE=no OVERLAYS="rk322x-custom-overlay" COMPRESS_OUTPUTIMAGE=sha,img,xz EXPERT=yes USE_CCACHE=yes

      - name: Upload Artifacts (Image + Logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-RK322x-${{ github.sha }}
          path: |
            build/output/images/*.img*
            build/output/logs/*.log
            build/output/debug/*.txt
          retention-days: 7
