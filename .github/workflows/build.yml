# .github/workflows/build.yml
name: Armbian Pure Script Build (RK3288)

on:
  push:
    branches: [ main ]
    paths:
      - 'userpatches/**'     # 只在改 DTS/overlay 时自动触发
      - 'config/boards/**'   # 如果自定义板
      - '.github/workflows/**'
  workflow_dispatch:        # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 加速：用更大 runner（可选，免费额度内）
        runner: [ubuntu-latest]
    steps:
      - name: Checkout your repo (with custom DTS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史

      - name: Setup Armbian Build Environment
        run: |
          # 安装依赖（Armbian 官方要求）
          sudo apt-get update
          sudo apt-get install -y git build-essential debootstrap qemu-user-static binfmt-support python3-pip ccache flex bison libssl-dev device-tree-compiler bc kmod cpio unzip rsync

      - name: Clone and Run Armbian Compile Script
        run: |
          # 克隆 Armbian build 框架（用 --depth=1 避开 fetch 超时）
          git clone --depth=1 https://github.com/armbian/build
          cd build
          
          # 复制你的自定义文件到 Armbian 目录（DTS overlay 等）
          cp -r ../userpatches ./userpatches || true
          cp -r ../config ./config || true  # 如果有自定义板
          
          # 运行编译（**正确参数**：无 image，直接用默认 image 目标）
          ./compile.sh \
            BOARD=firefly-rk3288 \          # 板子名（改成 custom-rk3288 如果自定义）
            BRANCH=current \                # 6.x 内核
            RELEASE=bookworm \              # Debian 12
            BUILD_MINIMAL=no \              # 完整系统
            BUILD_DESKTOP=no \              # 无桌面
            KERNEL_ONLY=no \                # 完整镜像
            KERNEL_CONFIGURE=no \           # 无交互配置
            OVERLAYS="rk3288-custom-overlay" \  # 你的 DTS overlay（userpatches/overlay/ 内）
            COMPRESS_OUTPUTIMAGE=sha,img,xz \   # 输出 .img.xz + sha
            EXPERT="yes" \                  # 启用 overlay
            USE_CCACHE="yes"                # 缓存加速（可选）

      - name: Upload Artifacts (Image + Logs)
        if: always()  # 即使失败也上传日志
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-RK3288-${{ github.sha }}
          path: |
            build/output/images/*.img*
            build/output/logs/*.log
            build/output/debug/*.txt  # 调试文件
          retention-days: 7
          compression-level: 0  # 快速上传
