# .github/workflows/build.yml
name: Armbian Build RK3288

on:
  push:
    branches: [ main ]
    paths:
      - 'userpatches/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-armbian:
    runs-on: ubuntu-latest
    name: Build Armbian for RK3288

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Armbian (RK3288)
        uses: oem-shi/armbian-build-actions@v2.0.15   # ← 这个是目前最稳定的
        with:
          BOARD: firefly-rk3288          # 如果你自定义板就改成 custom-rk3288
          RELEASE: bookworm
          KERNEL_BRANCH: current         # 6.x 主线
          KERNEL_CONFIGURE: "no"
          BUILD_DESKTOP: "no"
          BUILD_MINIMAL: "no"
          INSTALL_HEADERS: "yes"
          COMPRESS_OUTPUT: "xz"
          CUSTOM_OVERLAY: "yes"          # 启用你的 userpatches/overlay

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-RK3288-${{ github.sha }}
          path: |
            output/*.img
            output/*.img.xz
            output/*.txt
          if-no-files-found: error
