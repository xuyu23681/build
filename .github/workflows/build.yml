# .github/workflows/build.yml
name: Armbian Build (Auto)

on:
  push:
    branches:
      - main               # 每次 push 到 main 就自动编译
    paths:
      - 'userpatches/**'   # 只在你改了 DTS、overlay、补丁时才触发（可选，省时间）
      - '.github/workflows/build.yml'
  workflow_dispatch:       # 同时保留手动触发功能

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Armbian build
        uses: armbian/build-action@v1
        with:
          board: firefly-rk3288          # 如果你用了自定义板就改成 custom-rk3288
          branch: current                # 最新 6.x 内核
          release: bookworm              # Debian 12
          build_minimal: false
          build_desktop: false
          kernel_configure: false
          overlays: rk3288-custom-overlay   # ← 你的 DTS 叠加名字（没有就删掉这行）

      - name: Upload Armbian image
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-Image-${{ github.sha }}
          path: output/images/*.img*
