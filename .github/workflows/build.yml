# .github/workflows/build.yml
name: Armbian RK3288 CSC Build (Firefly Compatible)

on:
  push:
    branches: [ main ]
    paths:
      - 'userpatches/**'     # 只在改 DTS/overlay 时自动触发
      - 'config/boards/**'   # 如果自定义板
      - '.github/workflows/**'
  workflow_dispatch:        # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo (with custom DTS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Armbian Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential debootstrap qemu-user-static binfmt-support python3-pip ccache flex bison libssl-dev device-tree-compiler bc kmod cpio unzip rsync

      - name: Clone RK3288 CSC Fork and Run Compile Script
        run: |
          # 克隆 RK3288 专用社区 fork（有 xt-q8l-v10 等板配置）
          git clone --depth=1 https://github.com/mrfixit2001/armbian-build
          cd armbian-build
          
          # 复制你的自定义文件（DTS overlay 等）
          cp -r ../userpatches ./userpatches || true
          cp -r ../config ./config || true  # 如果有自定义板
          
          # 调试：输出参数确认
          echo "Running compile.sh with params: BOARD=xt-q8l-v10 BRANCH=current RELEASE=bookworm BUILD_MINIMAL=no BUILD_DESKTOP=no KERNEL_ONLY=no KERNEL_CONFIGURE=no OVERLAYS=rk3288-custom-overlay COMPRESS_OUTPUTIMAGE=sha,img,xz EXPERT=yes USE_CCACHE=yes"
          
          # 单行命令：用 CSC fork 的 RK3288 TV Box BOARD（兼容 Firefly），加载你的 overlay
          ./compile.sh BOARD=xt-q8l-v10 BRANCH=current RELEASE=bookworm BUILD_MINIMAL=no BUILD_DESKTOP=no KERNEL_ONLY=no KERNEL_CONFIGURE=no OVERLAYS="rk3288-custom-overlay" COMPRESS_OUTPUTIMAGE=sha,img,xz EXPERT=yes USE_CCACHE=yes

      - name: Upload Artifacts (Image + Logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-RK3288-${{ github.sha }}
          path: |
            armbian-build/output/images/*.img*
            armbian-build/output/logs/*.log
            armbian-build/output/debug/*.txt
          retention-days: 7
