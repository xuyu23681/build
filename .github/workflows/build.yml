name: Armbian Build

on:
  workflow_dispatch:  # 手动触发
    inputs:
      board:
        description: 'Board name'
        required: true
        default: 'firefly-rk3288'  # 或 'custom-rk3288'
      branch:
        description: 'Kernel branch'
        required: true
        default: 'current'  # 6.x 内核
      release:
        description: 'Release'
        required: true
        default: 'bookworm'  # Debian
      overlays:
        description: 'Overlays to include'
        required: false
        default: 'rk3288-custom-overlay'  # 你的叠加

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Armbian
      uses: armbian/build-action@v1  # Armbian 官方 action（如果可用），或用脚本
      with:
        board: ${{ inputs.board }}
        branch: ${{ inputs.branch }}
        release: ${{ inputs.release }}
        overlays: ${{ inputs.overlays }}
        build-minimal: 'no'
        build-desktop: 'no'
        kernel-configure: 'no'

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: armbian-image
        path: output/images/*.img.xz
